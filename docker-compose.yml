version: '3.8'

networks:
  homelab_net:
    external: true

services:
  nginx-proxy:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"       
      - "443:443"    
      - "81:81"       # Временный порт админки самого Nginx (потом его тоже спрячем)
    volumes:
      - ./nginx/data:/data
      - ./nginx/letsencrypt:/etc/letsencrypt
    networks:
      - homelab_net

 # локльный днс сервер, если у вас есть в роутере такая фича (то я завидую), то это можно закоментировать, хотя тут ведь еще блокировщик рекламы
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "3000:3000/tcp"   # временно открываем для админки, потом закроем после макстера настройки adguard
      - "8085:8085/tcp"   # этот порт я выбрал при первой настройке в админке, тут индивдуально, выбираем какой свободен
    volumes:
      - ./adguard/work:/opt/adguardhome/work
      - ./adguard/conf:/opt/adguardhome/conf
    networks:
      - homelab_net
      
      
  samba:
    image: dperson/samba:latest
    container_name: network_share
    ports:
      - "139:139"
      - "445:445"
    volumes:
      - ${HOME}/shared_folder:/mount 
    command:
      - -u
      - "admin;${SAMBA_PASSWORD}"
      - -s
      - "LanShare;/mount;yes;no;no;admin;admin;admin"
    restart: unless-stopped
    networks:
      - homelab_net
      
  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - ./qbittorrent:/config
      - ${HOME}/shared_folder/torrents:/downloads
    ports:
      - 6881:6881
      - 6881:6881/udp
    stop_grace_period: "10s"
    restart: unless-stopped
    networks:
      - homelab_net
 
  duckdns:
    image: linuxserver/duckdns:latest
    container_name: duckdns
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Moscow
      - SUBDOMAINS=${SUBDOMAIN}
      - TOKEN=${DUCKDNS_TOKEN}
    volumes:
      - ./duckdns:/config
    restart: unless-stopped
    networks:
      - homelab_net
  
  amnezia-wg-easy:
      image: ghcr.io/imbtqd/amnezia-wg-easy:latest
      container_name: amnezia-wg-easy
      privileged: true
      cap_add:
        - NET_ADMIN
        - SYS_MODULE
      environment:
        - WG_HOST=${SUBDOMAIN}.duckdns.org
        - PASSWORD=${VPN_ADMIN_PASSWORD}
        - WG_PORT=51820
        - PORT=51821
        - JC=5
        - JMIN=40
        - JMAX=150
        - S1=50
        - S2=60
      volumes:
        - ./amneziawg:/etc/amnezia/amneziawg
      ports:
        - "51820:51820/udp"
      restart: unless-stopped
      networks:
        - homelab_net
